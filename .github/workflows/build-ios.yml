name: Build A7-MUSIC iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Fix Node path for Xcode build scripts
        run: |
          sudo ln -sf $(which node) /usr/local/bin/node || true
          sudo ln -sf $(which npm) /usr/local/bin/npm || true
          sudo ln -sf $(which npx) /usr/local/bin/npx || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Apply patches
        run: npx patch-package || true

      # Cache CocoaPods BEFORE prebuild (prebuild runs pod install internally)
      - name: Restore CocoaPods cache
        id: pods-cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/ReactNative
          key: pods-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app.json') }}
          restore-keys: |
            pods-${{ hashFiles('package-lock.json') }}-
            pods-

      - name: Expo Prebuild iOS
        # expo prebuild runs pod install internally — no need to run pod install again
        run: npx expo prebuild --platform ios --clean

      # Save CocoaPods cache after prebuild (so next run is faster)
      - name: Save CocoaPods cache
        if: steps.pods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/ReactNative
          key: pods-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app.json') }}

      - name: Build iOS App (Unsigned)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No .xcworkspace found!"
            ls -la
            exit 1
          fi
          SCHEME=$(echo "$WORKSPACE" | sed 's/\.xcworkspace//')
          echo "🔨 Building: $WORKSPACE (Scheme: $SCHEME)"

          gem install xcpretty --quiet

          set -o pipefail
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -jobs $(sysctl -n hw.ncpu) \
            | xcpretty \
          || xcodebuild build \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Debug \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              -jobs $(sysctl -n hw.ncpu)

      - name: Package IPA
        run: |
          APP_PATH=$(find ios/build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app bundle found!"
            find ios/build -name "*.app" -type d 2>/dev/null || echo "No .app files anywhere"
            exit 1
          fi
          echo "📦 Packaging: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r A7-MUSIC.ipa Payload
          echo "✅ IPA created: $(du -sh A7-MUSIC.ipa | cut -f1)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A7-MUSIC-iOS-IPA
          path: A7-MUSIC.ipa
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: A7-MUSIC.ipa
          name: "A7 MUSIC ${{ github.ref_name }}"
          body: |
            ## 🎵 A7 MUSIC ${{ github.ref_name }}

            **The ultimate Music + Sport app — Spotify meets Strava. 100% Free. No ads.**

            ### 📥 iOS Installation (Sideloading)
            1. Download `A7-MUSIC.ipa` below
            2. Use **AltStore**, **Sideloadly**, or **TrollStore** to install
            3. Trust the developer in: **Settings → General → VPN & Device Management**
            4. Enjoy A7 MUSIC! 🎉

            > ⚠️ This is an unsigned IPA — sideloading tool required.
