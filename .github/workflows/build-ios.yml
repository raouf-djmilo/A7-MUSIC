name: Build A7-MUSIC iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPO_IMAGE_DISABLE_LIBDAV1D: "1"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcode installations:"
          ls -ld /Applications/Xcode*.app || true
          
          TARGET_XCODE=""
          for XC in $(ls -d /Applications/Xcode*.app 2>/dev/null); do
            SWIFT_BIN="$XC/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift"
            if [ -x "$SWIFT_BIN" ]; then
              SWIFT_VER=$("$SWIFT_BIN" --version 2>/dev/null | head -n 1)
              echo "$XC -> $SWIFT_VER"
              if echo "$SWIFT_VER" | grep -q "6\.3"; then
                TARGET_XCODE="$XC"
              fi
            fi
          done
          
          if [ -z "$TARGET_XCODE" ]; then
            for XC in /Applications/Xcode_16.3*.app /Applications/Xcode.app $(ls -d /Applications/Xcode*.app 2>/dev/null); do
              if [ -d "$XC" ]; then
                TARGET_XCODE="$XC"
                break
              fi
            done
          fi
          
          echo "Selecting: $TARGET_XCODE"
          sudo xcode-select -s "$TARGET_XCODE"
          xcodebuild -version
          swift --version

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Fix Node path for Xcode build scripts
        run: |
          sudo ln -sf $(which node) /usr/local/bin/node || true
          sudo ln -sf $(which npm) /usr/local/bin/npm || true
          sudo ln -sf $(which npx) /usr/local/bin/npx || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Apply patches
        run: npx patch-package || true

      - name: Expo Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          # Ensure script sandboxing is disabled for Pods in Xcode 16
          find Pods -name "*.pbxproj" -exec sed -i '' 's/ENABLE_USER_SCRIPT_SANDBOXING = YES/ENABLE_USER_SCRIPT_SANDBOXING = NO/g' {} + || true

      - name: Build iOS App (Unsigned)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No .xcworkspace found!"
            ls -la
            exit 1
          fi
          echo "📁 Workspace: $WORKSPACE"
          
          # List all schemes
          xcodebuild -list -workspace "$WORKSPACE"

          # Determine the primary scheme (exclude Pods)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '/Schemes:/{flag=1;next}/^[[:space:]]*$/{flag=0}flag' | tr -d ' ' | grep -v '^Pods-' | grep -v '^Pods$' | head -n 1)
          if [ -z "$SCHEME" ]; then
            SCHEME=$(echo "$WORKSPACE" | sed 's/\.xcworkspace//')
          fi
          echo "🔨 Building with Scheme: '$SCHEME'"

          set +e
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_SWIFT_FLAGS="-suppress-warnings" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            2>&1 | tee xcodebuild.log
          
          BUILD_STATUS=${PIPESTATUS[0]}

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "❌ xcodebuild failed with status $BUILD_STATUS"
            echo "=================== COMPILER ERRORS ==================="
            grep -E -C 2 "(error: |fatal error: |\*\* BUILD FAILED \*\*)" xcodebuild.log | head -n 120 || true
            echo "======================================================="
            echo "=================== LAST 150 LINES OF LOG ==================="
            tail -n 150 xcodebuild.log || true
            echo "============================================================="
            echo "## ❌ iOS Build Failed (Status $BUILD_STATUS)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 xcodebuild.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $BUILD_STATUS
          fi
          echo "✅ Xcode build completed successfully!"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log

      - name: Print Compiler Errors
        if: failure()
        run: |
          echo "=================== ERROR SEARCH ==================="
          grep -n -C 3 -i "error:" ios/xcodebuild.log | head -n 200 || true
          echo "=================== FAILED COMMANDS ==================="
          grep -n -C 5 "The following build commands failed:" ios/xcodebuild.log || true
          echo "=================== LAST 150 LINES ==================="
          tail -n 150 ios/xcodebuild.log || true

      - name: Publish Failure Log to Release
        if: failure() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/xcodebuild.log
          name: "Build Failure Log - ${{ github.ref_name }}"
          body: |
            iOS build failed. See attached xcodebuild.log for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package IPA
        run: |
          APP_PATH=$(find ios/build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app bundle found!"
            find ios/build -name "*.app" -type d 2>/dev/null || echo "No .app files anywhere"
            exit 1
          fi
          echo "📦 Packaging: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r A7-MUSIC.ipa Payload
          echo "✅ IPA created: $(du -sh A7-MUSIC.ipa | cut -f1)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A7-MUSIC-iOS-IPA
          path: A7-MUSIC.ipa
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: A7-MUSIC.ipa
          name: "A7 MUSIC ${{ github.ref_name }}"
          body: |
            ## 🎵 A7 MUSIC ${{ github.ref_name }}

            **The ultimate Music + Sport app — Spotify meets Strava. 100% Free. No ads.**

            ### 📥 iOS Installation (Sideloading)
            1. Download `A7-MUSIC.ipa` below
            2. Use **AltStore**, **Sideloadly**, or **TrollStore** to install
            3. Trust the developer in: **Settings → General → VPN & Device Management**
            4. Enjoy A7 MUSIC! 🎉

            > ⚠️ This is an unsigned IPA — sideloading tool required.
