name: Build A7-MUSIC iOS IPA (Unsigned)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS Runner (macos-15-intel starts in seconds; macos-15 is Apple Silicon ARM64)'
        required: false
        default: 'macos-15-intel'
        type: choice
        options:
          - 'macos-15-intel'
          - 'macos-15'
          - 'macos-latest'
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPO_IMAGE_DISABLE_LIBDAV1D: "1"
  USE_CCACHE: "1"
  CCACHE_SLOPPINESS: "clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,time_macros"

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Matching Toolchain (Swift 6.3)
        run: |
          echo "Available Xcode installations:"
          ls -ld /Applications/Xcode*.app || true
          
          TARGET_XCODE=""
          # Prioritize Xcode version with Swift 6.3 matching Expo SDK 58 prebuilds (e.g. Xcode 26.2)
          for XC in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V -r); do
            SWIFT_BIN="$XC/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift"
            if [ -x "$SWIFT_BIN" ]; then
              SWIFT_VER=$("$SWIFT_BIN" --version 2>/dev/null | head -n 1)
              echo "Checking $XC -> $SWIFT_VER"
              if echo "$SWIFT_VER" | grep -q "6\.3"; then
                TARGET_XCODE="$XC"
                echo "=> Matched Swift 6.3 toolchain in $XC"
                break
              fi
            fi
          done
          
          # Fallback: if no Swift 6.3 specifically found, pick Xcode 26.x or Xcode 16.x or default Xcode.app
          if [ -z "$TARGET_XCODE" ]; then
            TARGET_XCODE=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app /Applications/Xcode.app 2>/dev/null | head -n 1)
          fi
          
          echo "Selecting: $TARGET_XCODE"
          sudo xcode-select -s "$TARGET_XCODE"
          xcodebuild -version
          swift --version

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Fix Node path for Xcode build scripts
        run: |
          sudo ln -sf $(which node) /usr/local/bin/node || true
          sudo ln -sf $(which npm) /usr/local/bin/npm || true
          sudo ln -sf $(which npx) /usr/local/bin/npx || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Apply patches
        run: npx patch-package || true

      - name: Normalize Expo prebuild Swift interfaces
        run: python3 .github/scripts/normalize-swiftinterfaces.py node_modules

      - name: Setup ccache for fast C/C++ builds
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            brew install ccache
          fi
          CCACHE_DIR="${RUNNER_TEMP}/ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> $GITHUB_ENV
          mkdir -p "$CCACHE_DIR"
          ccache -M 2G
          ccache -z

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('package-lock.json', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Cache CocoaPods download cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Expo Prebuild iOS
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          # Ensure script sandboxing is disabled for Pods in Xcode 16/26
          find Pods -name "*.pbxproj" -exec sed -i '' 's/ENABLE_USER_SCRIPT_SANDBOXING = YES/ENABLE_USER_SCRIPT_SANDBOXING = NO/g' {} + || true
          cd ..
          python3 .github/scripts/normalize-swiftinterfaces.py ios

      - name: Build iOS App (Unsigned)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No .xcworkspace found!"
            ls -la
            exit 1
          fi
          echo "📁 Workspace: $WORKSPACE"
          
          # List all schemes
          xcodebuild -list -workspace "$WORKSPACE"

          # Determine the primary scheme (exclude Pods)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '/Schemes:/{flag=1;next}/^[[:space:]]*$/{flag=0}flag' | tr -d ' ' | grep -v '^Pods-' | grep -v '^Pods$' | head -n 1)
          if [ -z "$SCHEME" ]; then
            SCHEME=$(echo "$WORKSPACE" | sed 's/\.xcworkspace//')
          fi
          echo "🔨 Building with Scheme: '$SCHEME'"

          CPU_CORES=$(sysctl -n hw.ncpu 2>/dev/null || echo 4)
          echo "🚀 Parallel compilation with $CPU_CORES CPU cores"

          set +e
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -jobs "$CPU_CORES" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_SUPPRESS_WARNINGS=YES \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CLANG_ENABLE_EXPLICIT_MODULES=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            DEBUG_INFORMATION_FORMAT=dwarf \
            DEAD_CODE_STRIPPING=YES \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            2>&1 | tee xcodebuild.log
          
          BUILD_STATUS=${PIPESTATUS[0]}
          ccache -s || true

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "❌ xcodebuild failed with status $BUILD_STATUS"
            echo "=================== COMPILER ERRORS ==================="
            grep -E -C 2 "(error: |fatal error: |\*\* BUILD FAILED \*\*)" xcodebuild.log | head -n 120 || true
            echo "======================================================="
            echo "=================== LAST 150 LINES OF LOG ==================="
            tail -n 150 xcodebuild.log || true
            echo "============================================================="
            echo "## ❌ iOS Build Failed (Status $BUILD_STATUS)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 xcodebuild.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $BUILD_STATUS
          fi
          echo "✅ Xcode build completed successfully!"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            ios/xcodebuild.log
            node_modules/expo-modules-jsi/apple/prebuild_jsi.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Print Compiler Errors
        if: failure()
        run: |
          if [ -f ios/xcodebuild.log ]; then
            echo "=================== ERROR SEARCH ==================="
            grep -n -C 3 -i "error:" ios/xcodebuild.log | head -n 200 || true
            echo "=================== FAILED COMMANDS ==================="
            grep -n -C 5 "The following build commands failed:" ios/xcodebuild.log || true
            echo "=================== LAST 150 LINES ==================="
            tail -n 150 ios/xcodebuild.log || true
          fi
          if [ -f node_modules/expo-modules-jsi/apple/prebuild_jsi.log ]; then
            echo "=================== PREBUILD JSI ERROR SEARCH ==================="
            grep -n -C 3 -i "error:" node_modules/expo-modules-jsi/apple/prebuild_jsi.log | head -n 200 || true
            echo "=================== LAST 150 LINES OF PREBUILD JSI ==================="
            tail -n 150 node_modules/expo-modules-jsi/apple/prebuild_jsi.log || true
          fi

      - name: Publish Failure Log to Release
        if: failure() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/xcodebuild.log
          name: "Build Failure Log - ${{ github.ref_name }}"
          body: |
            iOS build failed. See attached xcodebuild.log for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package IPA
        run: |
          APP_PATH=$(find ios/build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app bundle found!"
            find ios/build -name "*.app" -type d 2>/dev/null || echo "No .app files anywhere"
            exit 1
          fi
          echo "📦 Packaging: $APP_PATH"
          rm -rf Payload A7-MUSIC.ipa
          mkdir -p Payload
          # Preserve symlinks (-P) to ensure lightweight IPA and valid framework integrity
          cp -RP "$APP_PATH" Payload/
          # Verify ExpoModulesJSI exports every Swift symbol required by prebuilt Expo frameworks (prevents DYLD launch crash)
          python3 - <<'PY'
          import subprocess, sys, glob, os
          app = glob.glob("Payload/*.app")[0]
          jsi = os.path.join(app, "Frameworks/ExpoModulesJSI.framework/ExpoModulesJSI")
          exported = set()
          for line in subprocess.check_output(["nm", "-gU", jsi], text=True).splitlines():
              parts = line.split()
              if parts:
                  exported.add(parts[-1])
          missing = []
          for fw_name in ["ExpoFileSystem", "ExpoModulesCore"]:
              fw = os.path.join(app, f"Frameworks/{fw_name}.framework/{fw_name}")
              if not os.path.exists(fw):
                  continue
              for sym in subprocess.check_output(["nm", "-u", fw], text=True).splitlines():
                  sym = sym.strip()
                  if sym.startswith("_$s14ExpoModulesJSI") and "0aB4Core" not in sym and sym not in exported:
                      missing.append((fw_name, sym))
          if missing:
              print("❌ Missing ExpoModulesJSI symbols referenced by prebuilt frameworks:")
              for fw_name, sym in missing:
                  print(f"  {fw_name}: {sym}")
              sys.exit(1)
          print(f"✅ Verified ExpoModulesJSI exports all symbols ({len(exported)} global symbols).")
          PY
          # Only strip debug symbols (-S) from the main app executable; never strip -x or tamper with prebuilt Frameworks
          APP_EXEC=$(find Payload/*.app -maxdepth 1 -type f -perm -111 | head -n 1)
          if [ -n "$APP_EXEC" ]; then
            strip -S "$APP_EXEC" 2>/dev/null || true
          fi
          # -9 max compression, -y preserves symlinks in zip archive; -q minimizes noisy logs
          zip -9 -qr -y A7-MUSIC.ipa Payload
          echo "✅ IPA created: $(du -sh A7-MUSIC.ipa | cut -f1)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A7-MUSIC-iOS-IPA
          path: A7-MUSIC.ipa
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: A7-MUSIC.ipa
          name: "A7 MUSIC ${{ github.ref_name }}"
          body: |
            ## 🎵 A7 MUSIC ${{ github.ref_name }}

            **Clean, lightweight Music app — 100% Free. No ads.**

            ### 📥 iOS Installation (Sideloading)
            1. Download `A7-MUSIC.ipa` below
            2. Use **AltStore**, **Sideloadly**, or **TrollStore** to install
            3. Trust the developer in: **Settings → General → VPN & Device Management**
            4. Enjoy A7 MUSIC! 🎉

            > ⚠️ This is an unsigned IPA — sideloading tool required.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
