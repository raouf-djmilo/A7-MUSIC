name: Build A7-MUSIC iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version
          swift --version

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Fix Node path for Xcode build scripts
        run: |
          sudo ln -sf $(which node) /usr/local/bin/node || true
          sudo ln -sf $(which npm) /usr/local/bin/npm || true
          sudo ln -sf $(which npx) /usr/local/bin/npx || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Apply patches
        run: npx patch-package || true

      - name: Expo Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS App (Unsigned)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No .xcworkspace found!"
            ls -la
            exit 1
          fi
          echo "📁 Workspace: $WORKSPACE"
          
          # List all schemes
          xcodebuild -list -workspace "$WORKSPACE"

          # Determine the primary scheme (exclude Pods)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '/Schemes:/{flag=1;next}/^[[:space:]]*$/{flag=0}flag' | tr -d ' ' | grep -v '^Pods-' | grep -v '^Pods$' | head -n 1)
          if [ -z "$SCHEME" ]; then
            SCHEME=$(echo "$WORKSPACE" | sed 's/\.xcworkspace//')
          fi
          echo "🔨 Building with Scheme: '$SCHEME'"

          set +e
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_SWIFT_FLAGS="-suppress-warnings" \
            2>&1 | tee xcodebuild.log
          
          BUILD_STATUS=${PIPESTATUS[0]}

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "❌ xcodebuild failed with status $BUILD_STATUS"
            echo "=================== COMPILER ERRORS ==================="
            grep -E -C 2 "(error: |fatal error: |\*\* BUILD FAILED \*\*)" xcodebuild.log | head -n 120 || true
            echo "======================================================="
            exit $BUILD_STATUS
          fi
          echo "✅ Xcode build completed successfully!"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log

      - name: Package IPA
        run: |
          APP_PATH=$(find ios/build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app bundle found!"
            find ios/build -name "*.app" -type d 2>/dev/null || echo "No .app files anywhere"
            exit 1
          fi
          echo "📦 Packaging: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r A7-MUSIC.ipa Payload
          echo "✅ IPA created: $(du -sh A7-MUSIC.ipa | cut -f1)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A7-MUSIC-iOS-IPA
          path: A7-MUSIC.ipa
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: A7-MUSIC.ipa
          name: "A7 MUSIC ${{ github.ref_name }}"
          body: |
            ## 🎵 A7 MUSIC ${{ github.ref_name }}

            **The ultimate Music + Sport app — Spotify meets Strava. 100% Free. No ads.**

            ### 📥 iOS Installation (Sideloading)
            1. Download `A7-MUSIC.ipa` below
            2. Use **AltStore**, **Sideloadly**, or **TrollStore** to install
            3. Trust the developer in: **Settings → General → VPN & Device Management**
            4. Enjoy A7 MUSIC! 🎉

            > ⚠️ This is an unsigned IPA — sideloading tool required.
