name: Build A7-MUSIC iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Fix Node path for Xcode build scripts
        run: |
          sudo ln -sf $(which node) /usr/local/bin/node || true
          sudo ln -sf $(which npm) /usr/local/bin/npm || true
          sudo ln -sf $(which npx) /usr/local/bin/npx || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Apply patches
        run: npx patch-package || true

      - name: Expo Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS App (Unsigned)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "No .xcworkspace found!"
            ls -la
            exit 1
          fi
          SCHEME=$(echo "$WORKSPACE" | sed 's/\.xcworkspace//')
          echo "Building: $WORKSPACE (Scheme: $SCHEME)"

          gem install xcpretty --quiet

          set -o pipefail
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty || xcodebuild build \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Debug \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          APP_PATH=$(find ios/build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found!"
            find ios/build -name "*.app" -type d
            exit 1
          fi
          echo "Packaging: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r A7-MUSIC.ipa Payload
          echo "IPA size: $(du -sh A7-MUSIC.ipa | cut -f1)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A7-MUSIC-iOS-IPA
          path: A7-MUSIC.ipa
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: A7-MUSIC.ipa
          name: "A7 MUSIC ${{ github.ref_name }}"
          body: |
            ## 🎵 A7 MUSIC ${{ github.ref_name }}

            **The ultimate Music + Sport app — Spotify meets Strava. 100% Free. No ads.**

            ### 📥 iOS Installation (Sideloading)
            1. Download `A7-MUSIC.ipa` below
            2. Use **AltStore**, **Sideloadly**, or **TrollStore** to install
            3. Trust the developer in: **Settings → General → VPN & Device Management**
            4. Enjoy A7 MUSIC! 🎉

            > ⚠️ This is an unsigned IPA — sideloading tool required.
